<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conflues</title>
    <!-- Use our custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
    <script>
        (function() {
            if (localStorage.getItem('sidebar-collapsed') === 'true') {
                document.documentElement.classList.add('sidebar-collapsed-init');
            }
        })();
    </script>
    <!-- Optional: Use unpkg for icons if needed later, e.g. Boxicons or FontAwesome -->
    <!-- <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> -->
</head>
<body>
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo-text">Conflues</span>
            <button id="sidebar-toggle" class="toggle-btn" aria-label="Toggle Sidebar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>
        <ul class="nav-menu">
            {% for item in nav_items %}
            <li class="nav-item">
                <a href="{{ item.path }}" class="nav-link {% if current_path == item.path or (not current_path and item.path == '/') %}active{% endif %}" title="{{ item.title }}">
                    <span class="nav-icon">{{ item.icon|safe }}</span>
                    <span class="nav-text">{{ item.label }}</span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Top bar (optional for breadcrumbs/user profile) -->
        <header class="top-bar">
            <h2 style="font-size: 1.2rem; font-weight: 500; color: var(--text-main);">{{ page_title or 'Quản lý Mã Giao Dịch' }}</h2>
        </header>

        <!-- Dynamic Content Injected Here -->
        <section class="content-area" style="max-width: none;">
            {% block content %}{% endblock %}
        </section>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('sidebar-toggle');

        if (document.documentElement.classList.contains('sidebar-collapsed-init')) {
            sidebar.classList.add('collapsed');
        }

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            const isCollapsed = sidebar.classList.contains('collapsed');
            localStorage.setItem('sidebar-collapsed', isCollapsed);
            if (isCollapsed) {
                document.documentElement.classList.add('sidebar-collapsed-init');
            } else {
                document.documentElement.classList.remove('sidebar-collapsed-init');
            }
        });
    </script>
</body>
</html>
